name: Publish beginner guide

on:
  workflow_dispatch:
  schedule:
    # Runs at 06:00, 12:00, 18:00, 00:00 KST.
    - cron: "0 21,3,9,15 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish next queued guide
        run: node scripts/publish-next-beginner-guide.mjs

      - name: Build
        run: npm run build

      - name: Commit published guide
        run: |
          if git diff --quiet; then
            echo "No guide was published."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml scripts/prerender-public-pages.mjs src/App.tsx src/views/InfoPageView.tsx
          git commit -m "feat(content): publish scheduled beginner guide"
          git push
